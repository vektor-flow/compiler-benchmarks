name: Source983 preview benchmarks

on:
  workflow_dispatch:
    inputs:
      target:
        description: Required remaining native coverage; Intel is additional
        type: choice
        options: [all, windows-x64, macos-arm64, macos-x64]
        default: all

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json, os
          rows = [{'target': 'windows-x64', 'runner': 'windows-2022'},
                  {'target': 'macos-arm64', 'runner': 'macos-15'},
                  {'target': 'macos-x64', 'runner': 'macos-15-intel'}]
          rows = [r for r in rows if os.environ['TARGET'] in ('all', r['target'])]
          assert rows
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('value=' + json.dumps({'include': rows}) + '\n')
          PY
  benchmark:
    needs: select
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.16.0'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: '1.12.6'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install pinned evidence encryption dependency
        run: python -m pip install cryptography==46.0.5
      - name: Run exact preview with private sealed inputs
        env:
          SOURCE983_INPUT_KEY: ${{ secrets.SOURCE983_INPUT_KEY }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          JULIA_NUM_THREADS: '1'
          JULIA_NUM_PRECOMPILE_TASKS: '2'
        run: python scripts/run_preview.py --target ${{ matrix.target }}
      - name: Retain encrypted selected evidence and safe terminal status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview072-${{ matrix.target }}
          path: |
            job-results/status.json
            job-results/selected-evidence.enc
            job-results/frozen-tools.enc
          if-no-files-found: error
          retention-days: 3
